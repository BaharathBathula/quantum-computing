name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Project tests
        run: pytest -q
      - name: Exercise autograder against the reference solutions
        run: QLAB_SOLUTIONS=1 pytest -q -m exercises
      - name: Exercise stubs must NOT pass (guards against leaked solutions)
        run: |
          if pytest -q -m exercises > /dev/null 2>&1; then
            echo "Exercise stubs passed the autograder; a solution leaked into exercises/." && exit 1
          fi

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Translations are complete and the built page is current
        run: python web/build.py --check

  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Run all nine concepts end to end
        run: python run_all.py --no-plots
      - name: Docker image builds
        run: docker build -t quantum-computing .
